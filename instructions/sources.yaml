# Global Macro Cockpit — source registry
# Companion to global-macro-cockpit.md
#
# The ingestion layer should iterate `series`, look up the referenced `provider`
# for access config, and dispatch on provider.access. Validate each series_id
# resolves before wiring it in. IDs/endpoints are best-known starting points,
# not guaranteed-current.
#
# indicator_class: leading | coincident | lagging | nowcast | derived | overlay
# access: fred | dbnomics | sdmx | api | csv | scrape | manual | market | transform

meta:
  version: 0.3
  emphasis: leading_indicators
  purpose: monitoring_only          # backtesting is a separate project; no vintages needed here
  refresh_model: fetch_on_view
  default_transforms: [level, yoy, mom_annualized, zscore_vs_history, percentile]
  cache:
    role: cache_not_warehouse       # latest vintage only; key by series_id + fetched_at
    strategy: read_through_stale_while_revalidate
    ttl_by_frequency:               # how long a fetched value stays "fresh" on a view open
      daily: 6h
      weekly: 1d
      monthly: 1d
      quarterly: 3d
      event: 1d
    notes: >
      Fetch-on-view = serve-if-fresh, fetch-if-stale, revalidate-in-background.
      Per-provider token-bucket rate limiting + bounded parallel fetch per view.
      Degrade per tile, not per view. Optionally shorten TTL inside known release
      windows (BLS/BEA/EIA calendars). Proprietary/manual tiles are written to the
      same cache out-of-band and just read on view open.
  notes: >
    Backbones are FRED (US + market/risk series, free key) and DBnomics
    (international, no key). Prefer these before any keyed/proprietary source.
    Keep tight free tiers (alphavantage, googletrends, coingecko public) off the
    interactive path — long TTL / out-of-band.
  cockpit_zones:                    # layout layer; map zone -> themes
    windscreen:   [cycle, financial_conditions, credit, rates, inflation, labor, liquidity]
    warning_lights: [recession_watch]
    speedometer:  [bubbles]
    side_windows: [markets, uncertainty]
    mirrors:      [consumer, trade]   # plus the lagging rows within other themes
    weather:      [uncertainty, inflation]
    gps:          [cycle]             # nowcasts (gdpnow, consensus)

providers:
  fred:
    name: "FRED / ALFRED (St. Louis Fed)"
    base_url: "https://api.stlouisfed.org/fred"
    auth: api_key            # env: FRED_API_KEY (free)
    r_client: fredr
    python_client: fredapi
    rate_limit: "~120/min (generous) — carry interactive load here"
    interactive: true
  dbnomics:
    name: "DBnomics (Banque de France / CEPREMAP)"
    base_url: "https://api.db.nomics.world/v22"
    auth: none
    r_client: rdbnomics
    python_client: dbnomics
    rate_limit: "no key; be polite"
    interactive: true
  bls:
    name: "U.S. Bureau of Labor Statistics"
    base_url: "https://api.bls.gov/publicAPI/v2"
    auth: api_key            # env: BLS_API_KEY (free; higher limits)
    rate_limit: "500/day registered"
    batch: 50                # up to ~50 series per request — collapse per view
  bea:
    name: "U.S. Bureau of Economic Analysis"
    base_url: "https://apps.bea.gov/api/data"
    auth: api_key            # env: BEA_API_KEY (free)
  eia:
    name: "U.S. Energy Information Administration"
    base_url: "https://api.eia.gov/v2"
    auth: api_key            # env: EIA_API_KEY (free)
  treasury:
    name: "U.S. Treasury fiscaldata"
    base_url: "https://api.fiscaldata.treasury.gov/services/api/fiscal_service"
    auth: none
  census:
    name: "U.S. Census Bureau"
    base_url: "https://api.census.gov/data"
    auth: api_key            # free
  oecd:
    name: "OECD (SDMX)"
    base_url: "https://sdmx.oecd.org/public/rest"
    auth: none
  eurostat:
    name: "Eurostat (SDMX/REST)"
    base_url: "https://ec.europa.eu/eurostat/api/dissemination"
    auth: none
  ecb:
    name: "ECB Statistical Data Warehouse (SDMX)"
    base_url: "https://data-api.ecb.europa.eu/service"
    auth: none
  worldbank:
    name: "World Bank Indicators"
    base_url: "https://api.worldbank.org/v2"
    auth: none
  imf:
    name: "IMF (SDMX)"
    base_url: "https://dataservices.imf.org/REST/SDMX_JSON.svc"
    auth: none
  bis:
    name: "Bank for International Settlements"
    base_url: "https://stats.bis.org"     # also via dbnomics provider 'BIS'
    auth: none
  cpb:
    name: "CPB Netherlands — World Trade Monitor"
    base_url: "https://www.cpb.nl"
    auth: none               # Excel download
  nyfed:
    name: "Federal Reserve Bank of New York"
    base_url: "https://www.newyorkfed.org"
    auth: none               # csv downloads (recession prob, SCE, HHDC)
  atlantafed:
    name: "Atlanta Fed — GDPNow"
    base_url: "https://www.atlantafed.org"
    auth: none
  policyuncertainty:
    name: "Economic Policy Uncertainty"
    base_url: "https://www.policyuncertainty.com"
    auth: none
  gpr:
    name: "Geopolitical Risk Index (Caldara & Iacoviello)"
    base_url: "https://www.matteoiacoviello.com/gpr.htm"
    auth: none
  shiller:
    name: "Robert Shiller online data (CAPE)"
    base_url: "https://shillerdata.com"      # mirror: http://www.econ.yale.edu/~shiller/data.htm
    auth: none                                # monthly Excel since 1871; multpl.com scrapeable alt
  finra:
    name: "FINRA margin statistics (Rule 4521)"
    base_url: "https://www.finra.org/investors/margin-statistics"
    auth: none                                # monthly Excel
  naaim:
    name: "NAAIM Exposure Index"
    base_url: "https://www.naaim.org/programs/naaim-exposure-index/"
    auth: none                                # weekly; scrape
  coingecko:
    name: "CoinGecko (crypto)"
    base_url: "https://api.coingecko.com/api/v3"
    auth: none                                # free Demo key recommended
    rate_limit: "public 5-15/min (unstable); free Demo key -> stable 30/min"
    interactive: caution                      # long TTL; or prefer Finnhub (60/min)
  googletrends:
    name: "Google Trends (unofficial)"
    base_url: "https://trends.google.com"
    auth: none                                # via pytrends / gtrendsR; unofficial, rate-limited
    rate_limit: "unofficial; aggressive blocking"
    interactive: false                        # long TTL, refresh out-of-band only
  stooq:
    name: "Stooq (free EOD market data)"
    base_url: "https://stooq.com/q/d/l/"
    auth: none               # CSV
  market_keyed:
    name: "Keyed free market-data tier (fallback)"
    options: [finnhub, twelvedata, tiingo, financialmodelingprep, alphavantage]
    auth: api_key
    rate_limit: "finnhub ~60/min (best free); alphavantage 25/day & 5/min (avoid for interactive)"
    interactive: caution                      # prefer finnhub if a keyed source is needed
  proprietary:
    name: "Proprietary / headline-only"
    auth: none               # scrape headline on release; no clean historical API

